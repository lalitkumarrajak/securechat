# Render Blueprint: New → Blueprint → pick this repo.
# Render's free web disk is wiped on every deploy/restart, so data lives in Postgres
# (e.g. Neon's free plan). Render asks for DATABASE_URL when you create the Blueprint.
services:
  - type: web
    name: securechat
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      - key: RETENTION_DAYS
        value: "30"
      - key: DATABASE_URL
        sync: false
