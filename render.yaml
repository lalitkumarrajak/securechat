# Render Blueprint: New → Blueprint → pick this repo.
# Render's free web disk is wiped on every deploy/restart, so data lives in MongoDB
# (e.g. Atlas's free M0 cluster). Render asks for MONGODB_URI when you create the Blueprint.
services:
  - type: web
    name: securechat
    runtime: node
    plan: free
    region: singapore # closest Render region to the Atlas cluster (Mumbai)
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      - key: RETENTION_DAYS
        value: "30"
      - key: MONGODB_URI
        sync: false
      # Optional: a TURN relay so calls also connect on strict mobile networks (see README).
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      # Optional: keep Drive's files in a Google Drive (see README, "Drive's files in Google Drive").
      - key: GDRIVE_CLIENT_ID
        sync: false
      - key: GDRIVE_CLIENT_SECRET
        sync: false
      - key: GDRIVE_REFRESH_TOKEN
        sync: false
      # Optional: keep Drive's files in Cloudflare R2 instead of MongoDB (see README, "Drive's files in R2").
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
