# Render Blueprint: New → Blueprint → pick this repo.
# Render's free web disk is wiped on every deploy/restart, so data lives in Postgres.
services:
  - type: web
    name: securechat
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      - key: RETENTION_DAYS
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: securechat-db
          property: connectionString

databases:
  - name: securechat-db
    plan: free
    postgresMajorVersion: "16"
