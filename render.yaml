# Render Blueprint: New → Blueprint → pick this repo.
# Render's free web disk is wiped on every deploy/restart, so data lives in MongoDB
# (e.g. Atlas's free M0 cluster). Render asks for MONGODB_URI when you create the Blueprint.
services:
  - type: web
    name: securechat
    runtime: node
    plan: free
    region: singapore # closest Render region to the Atlas cluster (Mumbai)
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      - key: RETENTION_DAYS
        value: "30"
      - key: MONGODB_URI
        sync: false
